[package]
name = "oneum"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "OnEum — a local music player for macOS, Windows, iPhone and Android"
license = "0BSD"
repository = "https://github.com/ywjung/oneum"
readme = "README.md"
publish = false
default-run = "oneum"

[lib]
name = "oneum"
path = "src/lib.rs"

[[bin]]
name = "oneum"
path = "src/main.rs"

[features]
# The scripted verification channel (ONEUM_SCRIPT, see src/ui/automation.rs) in release
# builds. Development runs and the smoke test build with it; distribution builds do not.
automation = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "system_fonts", "wgpu"] }
egui_extras = { version = "0.37", default-features = false }
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["opt-simd", "all-meta", "flac", "mp1", "mp2", "mp3", "wav", "aiff", "pcm", "aac", "alac", "isomp4", "caf", "ogg", "vorbis", "mkv", "adpcm"] }
# Decoders the main decoding library does not bring: Opus as a codec of it (its Ogg,
# Matroska and MP4 readers hand the packets over), WavPack and Monkey's Audio as
# decoders of their own (src/audio/blocks.rs). All three are Rust without unsafe code.
symphonia-opus = "0.1"
wavicle = "0.1"
ape-decoder = "0.3"
# Playback speed: changes how fast a song goes and leaves its pitch (WSOLA; Rust without
# unsafe code, src/audio/pace.rs).
wsola = "0.3"
# Network folders (WebDAV on a NAS) and, where it is switched on, lyrics from the
# internet are reached over TLS: rustls with the ring crypto provider (which builds for
# every system the app is built for without cmake), the certificate authorities
# Mozilla trusts, and ring itself for the fingerprint of a certificate the listener
# chose to trust. MD5 is for HTTP digest authentication (it is in the build already).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
ring = "0.17"
md-5 = "0.10"
# Wipes a password from memory when the app lets go of it (in the build already).
zeroize = "1"
# Without "id3v2_compression_support": a compressed ID3v2 frame can unpack to gigabytes
# (the reader does not limit it), and such frames are next to unknown in real files.
# 0.25.5 does not build without the feature; see [patch.crates-io] and vendor/lofty.
lofty = { version = "0.25", default-features = false }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = "0.3"
rubato = "5"
rtrb = "0.4"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
unicode-normalization = "0.1"
walkdir = "2"
fastrand = "2"
# Reads a font file's table of characters (to find the system's Korean font on Android).
# Already part of the build through the UI library's font lookup.
skrifa = "0.44"
# The graphics library eframe draws with, named here only to switch on its count of
# live objects (buffers, textures, views, encoders): a phone ran out of graphics
# memory, and the count says whether something of ours piles up (src/ui/memory.rs).
wgpu = { version = "30", default-features = false, features = ["counters"] }
winit = { version = "0.30", default-features = false }

# File dialogs. There is none for iOS or Android (the system's document picker is used
# there, see src/platform/ios and src/platform/android).
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = "0.18"

# The accessibility tree (VoiceOver, Narrator). On Android eframe offers it only with
# the "game activity", which the app does not use (see docs/ANDROID_PLAN.md).
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit"] }

# Android: the app is a shared library loaded by a native activity; Java is reached
# through JNI (src/platform/android).
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }
jni = "0.22"
ndk-context = "0.1"

# What macOS and iOS share: Foundation, CoreFoundation and the MediaPlayer framework.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-media-player = "0.3"
objc2-core-foundation = "0.3"
# The keychain, where the passwords of network folders are kept (src/platform/secrets.rs).
security-framework = "3"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-avf-audio = "0.3"
objc2-uniform-type-identifiers = "0.3"

# Windows' media controls (media keys and the system media overlay). The same version
# cpal and wgpu already use; the features only select the parts that are compiled.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["std", "Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
# Makes the certificate of the test server that speaks TLS.
rcgen = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# lofty 0.25.5 with the two imports it lacks to build without its default feature
# (vendor/lofty/README-ONEUM.md). Remove together with the folder once upstream builds.
[patch.crates-io]
lofty = { path = "vendor/lofty" }
