[package]
name = "oneum"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "OnEum — a local music player for macOS and Windows"
license = "MIT"
publish = false
default-run = "oneum"

[lib]
name = "oneum"
path = "src/lib.rs"

[[bin]]
name = "oneum"
path = "src/main.rs"

[features]
# The scripted verification channel (ONEUM_SCRIPT, see src/ui/automation.rs) in release
# builds. Development runs and the smoke test build with it; distribution builds do not.
automation = []

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
egui_extras = { version = "0.37", default-features = false }
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["opt-simd", "all-meta", "flac", "mp1", "mp2", "mp3", "wav", "aiff", "pcm", "aac", "alac", "isomp4", "caf", "ogg", "vorbis"] }
# Without "id3v2_compression_support": a compressed ID3v2 frame can unpack to gigabytes
# (the reader does not limit it), and such frames are next to unknown in real files.
# 0.25.5 does not build without the feature; see [patch.crates-io] and vendor/lofty.
lofty = { version = "0.25", default-features = false }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
rfd = "0.18"
tracing = "0.1"
tracing-subscriber = "0.3"
rubato = "5"
rtrb = "0.4"
rustfft = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
unicode-normalization = "0.1"
walkdir = "2"
fastrand = "2"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-media-player = "0.3"
objc2-core-graphics = "0.3"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-core-audio-types"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# lofty 0.25.5 with the two imports it lacks to build without its default feature
# (vendor/lofty/README-ONEUM.md). Remove together with the folder once upstream builds.
[patch.crates-io]
lofty = { path = "vendor/lofty" }
