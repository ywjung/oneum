# Checks on the systems the app is made for (macOS, Windows, the iPhone build's lints,
# and Android: the library, the APK and Android's own lint), and the dependencies'
# advisories.
# What this cannot cover (sound through a real device, VoiceOver/Narrator, a USB DAC,
# signing and notarisation) is checked by hand before a release: docs/RELEASE.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml selects the toolchain; rustup installs it on first use.
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The iPhone version is the same crate with other platform code and screens:
      # it has to compile and pass the lints too (scripts/check.sh does the same).
      - run: rustup target add aarch64-apple-ios-sim
      - run: cargo clippy --locked --lib --bin oneum --target aarch64-apple-ios-sim -- -D warnings
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      # (The player's tests one at a time: see the script.)
      - run: scripts/ci-test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: scripts/ci-test.sh
        shell: bash
      # The program has to come up on a machine without a graphics card (the runner
      # draws with Windows' software renderer) and report its state.
      - name: Start-up check
        shell: pwsh
        run: |
          cargo build --locked --release --features automation --bin oneum
          $profile = Join-Path $env:RUNNER_TEMP "oneum-profile"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $script = Join-Path $profile "script.txt"
          $dump = Join-Path $profile "state.json"
          Set-Content -Path $script -Value @("wait 1500", "volume 0", "dump $dump", "wait 300", "quit")
          $env:ONEUM_DATA_DIR = $profile
          $env:ONEUM_SCRIPT = $script
          $env:ONEUM_NO_MEDIA_SESSION = "1"
          $app = Start-Process -FilePath "target\release\oneum.exe" -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $dump) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          Get-Content (Join-Path $profile "logs\oneum.log") -ErrorAction SilentlyContinue
          if (-not (Test-Path $dump)) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue; throw "the app did not come up" }
          $state = Get-Content $dump -Raw | ConvertFrom-Json
          if ($state.state -ne "Idle") { throw "unexpected state: $($state.state)" }
          if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id -Force; throw "the app did not quit" }

  # The Android app is the same crate built as a shared library, inside a Java shell
  # (android/): a change on either side that the other does not follow shows up here,
  # before the APK is put together by hand. The runner has the Android SDK, an NDK
  # and several JDKs; the one it uses by default is newer than Gradle's Android plugin
  # reads ("Unsupported class file major version"), so 21 is named.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add aarch64-linux-android
      - run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Lints (Android)
        run: . scripts/android-env.sh && cargo clippy --locked --lib --target aarch64-linux-android -- -D warnings
      - name: The library and the release APK (the build that is installed by hand)
        run: scripts/android-build.sh --release
      - name: The app bundle for Google Play (the build without all files access)
        run: scripts/android-build.sh --release --play --bundle
      - name: Android lint of both builds (an error fails the job)
        run: cd android && ./gradlew --quiet lintDirectRelease lintPlayRelease

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
