plugins {
    id 'com.android.application'
}

// The version and the build number come from Cargo.toml and git (the build script
// passes them); the defaults are for a build started from Android Studio.
def oneumVersion = providers.gradleProperty('oneumVersion').getOrElse('0.2.0')
def oneumBuild = providers.gradleProperty('oneumBuild').getOrElse('1').toInteger()

android {
    namespace 'app.oneum.android'
    compileSdk 36

    defaultConfig {
        applicationId 'app.oneum.android'
        // Android 11: the first with "all files access", which the library needs.
        minSdk 30
        // What Google Play asks of a new app (since 2026-08-31: Android 16).
        targetSdk 36
        versionCode oneumBuild
        versionName oneumVersion
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Two builds of the one app. "direct" is the APK that is installed by hand and may
    // be given "all files access"; "play" is what goes to Google Play, which does not
    // let a music player declare that right (src/direct/AndroidManifest.xml).
    flavorDimensions 'store'
    productFlavors {
        direct {
            dimension 'store'
        }
        play {
            dimension 'store'
        }
    }

    signingConfigs {
        // A key of the user's own, told through the environment (never kept in the
        // repository). Without one the release is signed with the debug key, which
        // is enough to install it on one's own phone.
        release {
            def store = System.getenv('ONEUM_ANDROID_KEYSTORE')
            if (store) {
                // The password itself, or the file it is kept in (one line).
                def secret = System.getenv('ONEUM_ANDROID_KEYSTORE_PASSWORD')
                def secretFile = System.getenv('ONEUM_ANDROID_KEYSTORE_PASSWORD_FILE')
                if (!secret && secretFile) {
                    secret = new File(secretFile).text.trim()
                }
                storeFile file(store)
                storePassword secret
                keyAlias System.getenv('ONEUM_ANDROID_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('ONEUM_ANDROID_KEY_PASSWORD') ?: secret
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('ONEUM_ANDROID_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        jniLibs {
            // The library is loaded from the APK's own folder of libraries.
            useLegacyPackaging = true
        }
    }

    // Android's own checks of the Java shell and its resources: an error stops the
    // build (a release build too); warnings are reported.
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
